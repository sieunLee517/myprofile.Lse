<!doctype html>
<html lang="{{ .Site.Language.Locale }}">
<head>
  {{ partial "headers.html" . }}
  {{ partial "custom_headers.html" . }}
  <link rel="stylesheet" href="{{ "css/major-records.css" | relURL }}">
  <link rel="stylesheet" href="{{ "css/record-tasks.css" | relURL }}?v=3">
  <script defer src="{{ "js/record-task-store.js" | relURL }}?v=3"></script>
  <script defer src="{{ "js/record-tasks.js" | relURL }}?v=3"></script>
</head>
<body class="db-record-page">
  {{ $home := .Site.Home.RelPermalink }}
  <header id="top" class="container db-record-header">
    <h1><a href="{{ $home }}">{{ .Site.Title }}</a></h1>
    <nav aria-label="홈 섹션">
      <ul class="list-inline">
        <li><a href="{{ $home }}#about">About</a></li>
        <li><a href="{{ $home }}#records-of-major">Records of Major</a></li>
        <li><a href="{{ $home }}#personal-productivity">Productivities</a></li>
        <li>
          <a href="https://github.com/sieunLee517" aria-label="이시은의 GitHub 프로필">
            <i class="fab fa-github" aria-hidden="true"></i>
          </a>
        </li>
      </ul>
    </nav>
  </header>

  <main class="container db-record-main">
    {{ partial "record-tasks.html" . }}
    {{ .Content }}
  </main>

  {{ partial "footer.html" . }}
</body>
</html>
