{{ $title := .Get 0 }}
{{ $path := .Get 1 }}

{{ with resources.Get $path }}
<details{{ if ge (len $.Params) 3 }} class="{{ $.Get 2 }}"{{ end }}>
  <summary>{{ $title }}</summary>
  <div>
    {{ $.Page.RenderString (dict "display" "block") .Content }}
  </div>
</details>
{{ else }}
  {{ errorf "펼치기 본문 파일을 찾을 수 없습니다: %s" $path }}
{{ end }}
